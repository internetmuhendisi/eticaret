  const kategori = durum.ornekEk === 'hepsi' ? 'Elektronik Aksesuar (örnek)' : 'Elektronik Aksesuar';
  if (durum.hal === 'kart') {
    return vitrinS(`${sayfaYolu(['Ana sayfa', kategori])}<h1 class="b1" style="margin: 12px 0 16px">${kategori}</h1><div class="izgara izgara-urun">${ORNEKLER.map(ornekKarti).join('')}</div>${not('Örnek ürün listede ve aramada öteki ürünler gibi görünür; adının sonundaki "(örnek)" eki ürünün adının parçasıdır, mağaza sahibi ürünü düzenleyip ekini kaldırabilir. Panelin Ürünler ekranında "Örnek ürünler" süzgeci vardır.')}${not(durum.arama === 'kapali' ? 'Örnek ürünün sayfası arama motorlarına kapalıdır (noindex) ve site haritasına girmez; mağaza sahibi düzenleyince ürün mağazanın olur ve açılır.' : 'Örnek ürünün sayfası öteki ürünler gibi arama motorlarına açıktır (sitenin arama motoru ayarına bağlı).')}`, 0);
  }
  const u = ORNEKLER[0];
  const satis = durum.satilabilir === 'uyari'
    ? `${uyariKutu('bilgi', 'bilgi', 'Bu bir örnek üründür: mağaza demo içeriğiyle açıldı. Sipariş verebilirsiniz; ürünün bilgileri mağazanın gerçek ürünleri yerleşene kadar değişebilir.')}<div class="satin-al"><button type="button" class="dugme dugme-birincil dugme-buyuk">${ikon('canta')}Sepete ekle</button><button type="button" class="ikon-dugme" aria-pressed="false" aria-label="Favorilere ekle">${ikon('kalp')}</button></div>`
    : `${uyariKutu('bilgi', 'bilgi', 'Bu bir örnek üründür, satılmaz. Mağazanın gerçek ürünleri yakında burada.')}<div class="satin-al"><button type="button" class="dugme dugme-birincil dugme-buyuk" aria-disabled="true">${ikon('canta')}Sepete eklenemez</button></div>`;
  return vitrinS(`${sayfaYolu(['Ana sayfa', kategori, ornekAd(u.ad)])}
    <div class="urun-ust" style="margin-top: 12px">
      <div class="galeri" style="grid-template-columns: minmax(0, 1fr)"><div class="galeri-buyuk"><img src="${u.img}" alt="${u.alt}"></div></div>
      <div class="urun-bilgi">
        <div class="urun-ad-satir"><span class="ust-metin" style="font-size: 13px">Örnek Ses</span><h1 class="b1">${ornekAd(u.ad)}</h1></div>
        <div class="urun-fiyat"><strong class="indirimli">${u.fiyat}</strong><s><span class="gizli">Eski fiyat </span>${u.eski}</s></div>
        <p>Katlanabilir kulak üstü kablosuz kulaklık: 30 saat pil, hızlı şarj.</p>
        ${satis}
      </div>
    </div>
    ${not(durum.satilabilir === 'uyari' ? 'Uyarı yalnız örnek üründe ve mağaza satışa açılana kadar görünür; satıştaki mağazaya örnek ürün aktarılmaz.' : 'Örnek ürün sepete eklenmez; kartta "Sepete ekle" düğmesi çizilmez.')}`, 0);
}

const SAYFALAR = [['demolar', 'Demolar'], ['vitrin', 'Vitrinde örnek ürün']];
const HALLER = {
  demolar: [['liste', 'Liste'], ['pencere', 'İçe aktarma penceresi'], ['satista', 'Satıştaki mağazada'], ['ilerleme', 'İçe aktarılıyor'], ['sonuc', 'Sonuç'], ['geriDon', 'Önceki hâline dön'], ['hata', 'İçe aktarılamadı']],
  vitrin: [['kart', 'Kategori sayfası'], ['urun', 'Ürün sayfası']]
};
// Seçilecekler: kullanıcının ürün kararları; önerilen değer ilk sıradadır. "Göster": site ayarları.
const SECIMLER = {
  ornekKapsam: { ad: 'Örnek veriler', sayfalar: ['demolar'], degerler: [['hepsi', 'Ürün, kategori, marka, blog, sayfa, kupon (önerim)'], ['urun', 'Yalnız ürünler']] },
  ornekEk: { ad: '"(örnek)" eki', sayfalar: ['demolar', 'vitrin'], degerler: [['urun', 'Yalnız ürün adında (önerim)'], ['hepsi', 'Kategori, marka, blogda da']] },
  korunan: { ad: 'Düzen ve menüler', sayfalar: ['demolar'], degerler: [['yanina', 'Demonunkiyle değişir (önerim)'], ['dokunma', 'Değişmez']] },
  tema2: { ad: 'Tema', sayfalar: ['demolar'], degerler: [['sor', 'Pencerede sorulur (önerim)'], ['degismez', 'Değişmez']] },
  gecis: { ad: 'Başka demoya geçiş', sayfalar: ['demolar'], degerler: [['kaldir', 'Dokunulmamış örnekler kalkar (önerim)'], ['birak', 'Örnekler kalır']] },
  geriDon: { ad: 'Önceki hâline dön', sayfalar: ['demolar'], degerler: [['son', 'Son içe aktarmayı geri alır (önerim)'], ['ilk', 'İlk demodan önceye']] },
  kim: { ad: 'Satıştaki mağaza', sayfalar: ['demolar'], degerler: [['ornekYok', 'Örneksiz aktarılır (önerim)'], ['kapali', 'Hiç aktarılmaz']] },
  gez: { ad: 'Demoyu gez', sayfalar: ['demolar'], degerler: [['gorsel', 'Önizleme görselleri (önerim)'], ['site', 'Demo sitesi']] },
  ekSilinince: { ad: 'Düzenlenen örnek ürün', sayfalar: ['demolar', 'vitrin'], degerler: [['sahiplen', 'Mağazanın olur (önerim)'], ['ornek', 'Ek silinse de örnek kalır']] },
  arama: { ad: 'Arama motoru', sayfalar: ['vitrin'], degerler: [['kapali', 'Örnek ürün kapalı (önerim)'], ['acik', 'Öteki ürünler gibi']] },
  yetki: { ad: 'İçe aktaran', sayfalar: ['demolar'], degerler: [['sahip', 'Yalnız mağaza sahibi (önerim)'], ['tema', 'Temayı değiştirebilen herkes']] },
  satilabilir: { ad: 'Örnek ürün', sayfalar: ['vitrin'], degerler: [['uyari', 'Satılır, uyarıyla (önerim)'], ['satilmaz', 'Satılmaz']] },
  demolarAcik: { ad: 'Ayar: Demolar ekranı', sayfalar: ['demolar'], degerler: [['acik', 'Açık'], ['kapali', 'Kapalı']], ayar: true },
  demoListesi: { ad: 'Ayar: kullanılabilecek demolar', sayfalar: ['demolar'], degerler: [['hepsi', 'Bütün demolar'], ['secili', 'Yalnız demo1']], ayar: true }
};
const durum = { sayfa: 'demolar', tema: 'acik', gorunum: 'masaustu', hal: 'liste', ustSerit: 'var', bildirimSure: '30', ornekKapsam: 'hepsi', ornekEk: 'urun', korunan: 'yanina', tema2: 'sor', gecis: 'kaldir', geriDon: 'son', kim: 'ornekYok', gez: 'gorsel', satilabilir: 'uyari', ekSilinince: 'sahiplen', arama: 'kapali', yetki: 'sahip', demolarAcik: 'acik', demoListesi: 'hepsi' };
const adres = new URLSearchParams(location.search);
for (const k of Object.keys(durum)) if (adres.get(k) !== null) durum[k] = adres.get(k);
// "Satıştaki mağaza: hiç aktarılmaz" seçiminde o hâl pencere yerine bilgi kutusu gösterir.
const satistaKapali = () => durum.kim === 'kapali';

const CIZICILER = {
  demolar: () => (durum.hal === 'satista' && satistaKapali()
    ? panelY('demolar', `${demoKomut()}<div class="panel-govde">${uyariKutu('bilgi', 'bilgi', '<strong>Mağaza satışta.</strong> Satıştaki mağazaya demo içe aktarılmaz: ana sayfanız, menüleriniz ve ürünleriniz müşterilerinizin gördüğü hâlinde kalır. Düzeni Vitrin bölümleri ekranından değiştirebilirsiniz.')}<div class="demo-izgara">${DEMOLAR.map(demoKarti).join('').replaceAll(`<button type="button" class="dugme dugme-birincil">${ikon('yukle')}İçe aktar</button>`, `<button type="button" class="dugme dugme-birincil" aria-disabled="true">${ikon('yukle')}İçe aktar</button>`)}</div></div>`)
    : demolarEkrani()),
  vitrin: vitrinOrnek
};

document.getElementById('sayfa-grubu').innerHTML = `<span>Ekran</span>${SAYFALAR.map(([k, a]) => `<button type="button" data-sayfa="${k}">${a}</button>`).join('')}`;
function uygula() {
  const haller = HALLER[durum.sayfa];
  if (haller.length && !haller.some(([k]) => k === durum.hal)) durum.hal = haller[0][0];
  document.getElementById('hal-grubu').innerHTML = haller.length ? `<span>Hâl</span>${haller.map(([k, a]) => `<button type="button" data-hal="${k}">${a}</button>`).join('')}` : '';
  const secimler = Object.entries(SECIMLER).filter(([, s]) => s.sayfalar.includes(durum.sayfa));
  const grup = ([k, s]) => `<div class="grup ${s.ayar ? '' : 'secim'}"><span>${s.ad}</span>${s.degerler.map(([d, a]) => `<button type="button" data-${k.replace(/[A-Z0-9]/g, (h) => `-${h.toLowerCase()}`)}="${d}">${a}</button>`).join('')}</div>`;
  const karar = secimler.filter(([, s]) => !s.ayar);
  const ayar = secimler.filter(([, s]) => s.ayar);
  document.getElementById('secim-satiri').innerHTML = `${karar.length ? `<span class="secim-baslik">Seçilecekler:</span>${karar.map(grup).join('')}` : ''}${ayar.length ? `<span class="secim-alt-baslik">Göster:</span>${ayar.map(grup).join('')}` : ''}`;
  document.getElementById('sayfa').dataset.tema = durum.tema;
  document.getElementById('sahne').classList.toggle('telefon', durum.gorunum === 'telefon');
  document.getElementById('icerik').innerHTML = CIZICILER[durum.sayfa]();
  for (const b of document.querySelectorAll('.arac-cubugu button')) {
    const [k] = Object.keys(b.dataset);
    b.setAttribute('aria-pressed', String(String(durum[k]) === b.dataset[k]));
  }
  try { history.replaceState(null, '', `?${new URLSearchParams(durum)}`); } catch (e) { /* file:// adresinde izin verilmeyebilir */ }
}
document.querySelector('.arac-cubugu').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const [k] = Object.keys(b.dataset);
  durum[k] = b.dataset[k];
  uygula();
};
uygula();

</script>
</body>
</html>
