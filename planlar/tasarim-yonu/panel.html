  siparis: [['ayrinti', 'Ayrıntı'], ['faturaForm', 'Fatura ekle'], ['adresForm', 'Adresi düzelt'], ['urunDuzelt', 'Ürünleri düzelt'], ['iadeTakildi', 'Takılan iade']],
  fis: [], musteriler: [],
  musteri: [['ayrinti', 'Ayrıntı'], ['notForm', 'Not ekle']],
  blog: [['liste', 'Yazılar'], ['form', 'Yazı formu'], ['formHata', 'Yazı formu (hatalı)']],
  sayfalar: [['liste', 'Sayfalar'], ['form', 'Sayfa formu'], ['menuBag', 'Menüye bağlama']],
  vitrin: [['liste', 'Blog listesi'], ['yazi', 'Yazı'], ['sayfa', 'Sabit sayfa']],
  ekip: [['liste', 'Kullanıcılar'], ['davet', 'Davet penceresi'], ['davetBag', 'Davet bağlantısı'], ['kisi', 'Kullanıcı'], ['roller', 'Roller']],
  davet: [['form', 'Davet'], ['gecersiz', 'Geçersiz davet']]
};
// Seçilecekler: kullanıcının ürün kararları; önerilen değer ilk sıradadır. "Göster": site ayarları ve gezinti.
const SECIMLER = {
  toplu: { ad: 'Toplu işlemler', sayfalar: ['urunler', 'siparisler', 'musteriler'], degerler: [['temel', 'Temel (önerim)'], ['genis', 'Geniş']] },
  urunDuzen: { ad: 'Ürün ekranı', sayfalar: ['urun'], degerler: [['tek', 'Tek sayfa (önerim)'], ['sekme', 'Sekmeler']] },
  birlesimGiris: { ad: 'Birleşimlerin fiyatı ve stoğu', sayfalar: ['urun'], degerler: [['tablo', 'Tabloda toplu (önerim)'], ['tek', 'Tek tek pencerede']] },
  adresDuzelt: { ad: 'Adres düzeltme', sayfalar: ['siparis'], degerler: [['kargo', 'Kargoya kadar (önerim)'], ['odeme', 'Yalnız ödeme beklenirken']] },
  urunDuzelt: { ad: 'Ürün ve adet düzeltme', sayfalar: ['siparis'], degerler: [['yok', 'Bu bölümde yok (önerim)'], ['var', 'Ödeme beklenirken var']] },
  duzeltBildir: { ad: 'Düzeltmede müşteriye', sayfalar: ['siparis'], degerler: [['eposta', 'E-posta kutusu (önerim)'], ['yok', 'Bildirim yok']] },
  fatura: { ad: 'Fatura', sayfalar: ['siparis'], degerler: [['ikisi', 'Numara ve PDF (önerim)'], ['numara', 'Yalnız numara'], ['dosya', 'Yalnız PDF']] },
  faturaMusteri: { ad: 'Müşteri faturayı', sayfalar: ['siparis'], degerler: [['goster', 'Görür (önerim)'], ['gizle', 'Görmez']] },
  musteriIslem: { ad: 'Müşteride mağaza', sayfalar: ['musteri'], degerler: [['notSifre', 'Not + şifre bağlantısı (önerim)'], ['not', 'Yalnız not'], ['tam', 'Hesabı da kapatır']] },
  musteriKapsam: { ad: 'Müşteri listesi', sayfalar: ['musteriler'], degerler: [['uye', 'Yalnız üyeler (önerim)'], ['herkes', 'Üye olmayanlar da']] },
  blogAlan: { ad: 'Blog yazısı', sayfalar: ['blog', 'vitrin'], degerler: [['kategorili', 'Kategori ve yazarla (önerim)'], ['sade', 'Sade']] },
  sayfaAdres: { ad: 'Sayfa adresi', sayfalar: ['sayfalar', 'vitrin'], degerler: [['onekli', '/sayfa/hakkimizda (önerim)'], ['kok', '/hakkimizda']] },
  rolTanim: { ad: 'Roller', sayfalar: ['ekip'], degerler: [['hazir', 'Hazır roller (önerim)'], ['ozel', 'Mağaza tanımlar']] },
  davetSure: { ad: 'Davet süresi', sayfalar: ['ekip'], degerler: [['3', '3 gün (önerim)'], ['7', '7 gün']] },
  pano: { ad: 'Pano', sayfalar: ['pano'], degerler: [['yapilacak', 'Bakılacaklar önde (önerim)'], ['ozet', 'Sayılar önde']] },
  urunSekme: { ad: 'Sekme', sayfalar: ['urun'], degerler: URUN_SEKMELER, ayar: true },
  listeSatir: { ad: 'Ayar: sayfa başına satır', sayfalar: ['urunler', 'siparisler', 'musteriler', 'blog'], degerler: [['25', '25'], ['50', '50'], ['100', '100']], ayar: true },
  fisFiyat: { ad: 'Ayar: fişte fiyat', sayfalar: ['fis'], degerler: [['goster', 'Göster'], ['gizle', 'Gizle']], ayar: true },
  blogAcik: { ad: 'Ayar: blog', sayfalar: ['blog', 'vitrin'], degerler: [['acik', 'Açık'], ['kapali', 'Kapalı']], ayar: true }
};
const durum = { sayfa: 'pano', tema: 'acik', gorunum: 'masaustu', hal: 'normal', panelMenu: 'sol', toplu: 'temel', urunDuzen: 'tek', urunSekme: 'genel', birlesimGiris: 'tablo', adresDuzelt: 'kargo', urunDuzelt: 'yok', duzeltBildir: 'eposta', fatura: 'ikisi', faturaMusteri: 'goster', musteriIslem: 'notSifre', musteriKapsam: 'uye', blogAlan: 'kategorili', sayfaAdres: 'onekli', rolTanim: 'hazir', davetSure: '3', pano: 'yapilacak', listeSatir: '25', fisFiyat: 'goster', blogAcik: 'acik' };
const adres = new URLSearchParams(location.search);
for (const k of Object.keys(durum)) if (adres.get(k) !== null) durum[k] = adres.get(k);

const CIZICILER = {
  pano: panoEkrani, urunler: urunlerEkrani, magaza: magazaEkrani, tema: temaAyarlari, slider: sliderEkrani, urun: urunEkrani, katalog: katalogEkrani, yorumlar: yorumlarEkrani,
  siparisler: siparislerEkrani, siparis: siparisEkrani, fis: fisEkrani, musteriler: musterilerEkrani, musteri: musteriEkrani,
  blog: blogPanel, sayfalar: sayfalarPanel, vitrin: vitrinIcerik, ekip: ekipEkrani, davet: davetKabul
};
document.getElementById('sayfa-grubu').innerHTML = `<span>Ekran</span>${SAYFALAR.map(([k, a]) => `<button type="button" data-sayfa="${k}">${a}</button>`).join('')}`;
function uygula() {
  const haller = HALLER[durum.sayfa];
  if (haller.length && !haller.some(([k]) => k === durum.hal)) durum.hal = haller[0][0];
  document.getElementById('hal-grubu').innerHTML = haller.length ? `<span>Hâl</span>${haller.map(([k, a]) => `<button type="button" data-hal="${k}">${a}</button>`).join('')}` : '';
  const secimler = Object.entries(SECIMLER).filter(([k, s]) => s.sayfalar.includes(durum.sayfa) && (k !== 'urunSekme' || durum.urunDuzen === 'sekme'));
  const grup = ([k, s]) => `<div class="grup ${s.ayar ? '' : 'secim'}"><span>${s.ad}</span>${s.degerler.map(([d, a]) => `<button type="button" data-${k.replace(/[A-Z]/g, (h) => `-${h.toLowerCase()}`)}="${d}">${a}</button>`).join('')}</div>`;
  const karar = secimler.filter(([, s]) => !s.ayar);
  const ayar = secimler.filter(([, s]) => s.ayar);
  document.getElementById('secim-satiri').innerHTML = `${karar.length ? `<span class="secim-baslik">Seçilecekler:</span>${karar.map(grup).join('')}` : ''}${ayar.length ? `<span class="secim-alt-baslik">Göster:</span>${ayar.map(grup).join('')}` : ''}`;
  document.getElementById('sayfa').dataset.tema = durum.tema;
  document.getElementById('sahne').classList.toggle('telefon', durum.gorunum === 'telefon');
  document.getElementById('icerik').innerHTML = CIZICILER[durum.sayfa]();
  for (const b of document.querySelectorAll('.arac-cubugu button')) {
    const [k] = Object.keys(b.dataset);
    b.setAttribute('aria-pressed', String(String(durum[k]) === b.dataset[k]));
  }
  try { history.replaceState(null, '', `?${new URLSearchParams(durum)}`); } catch (e) { /* file:// adresinde izin verilmeyebilir */ }
}
document.querySelector('.arac-cubugu').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const [k] = Object.keys(b.dataset);
  durum[k] = b.dataset[k];
  uygula();
};
uygula();
</script>
