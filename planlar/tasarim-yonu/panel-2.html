  excelHata: { ad: 'Hatalı satır varken', sayfalar: ['excel'], degerler: [['hepsi', 'Hiç uygulanmaz (önerim)'], ['atla', 'Hatalılar atlanır']] },
  siparisExcelYer: { ad: 'Siparişleri dışa aktarma', sayfalar: ['siparisExcel'], degerler: [['temel', 'Temel pakette, CSV (önerim)'], ['eklenti', 'Excel eklentisinde']] },
  raporCiro: { ad: 'Ciroya giren', sayfalar: ['raporlar'], degerler: [['odenmis', 'Ödemesi alınmış (önerim)'], ['hepsi', 'İptal edilmemiş hepsi']] },
  bildirimAyar: { ad: 'Bildirim ayarı', sayfalar: ['bildirimler'], degerler: [['panelHep', 'Panel hep açık (önerim)'], ['ortak', 'Tek anahtar'], ['ayri', 'İki ayrı anahtar']] },
  ustSerit: { ad: 'Arama ve zil', sayfalar: ['bildirimler', 'arama', 'pano'], degerler: [['var', 'Üst şeritte (önerim)'], ['menu', 'Menünün başında']] },
  ytBicim: { ad: 'Bilgi yazımı', sayfalar: ['epostalar'], degerler: [['koseli', '[Müşteri adı] (önerim)'], ['kodlu', '{musteri_adi}']] },
  dahilHaric: { ad: 'Dahil-hariç değişince', sayfalar: ['vergi'], degerler: [['cevir', 'Fiyatlar çevrilir (önerim)'], ['koru', 'Fiyatlar aynen kalır']] },
  kargoSinir: { ad: 'Ayar: ücretsiz kargo sınırı', sayfalar: ['kuponVitrin'], degerler: [['once', 'Kupondan önce'], ['sonra', 'Kupondan sonra']], ayar: true },
  kodHarf: { ad: 'Ayar: kupon kodu', sayfalar: ['kuponlar'], degerler: [['duyarsiz', 'Harf büyüklüğü fark etmez'], ['duyarli', 'Ayrılır']], ayar: true },
  excelSinir: { ad: 'Ayar: dosyada satır', sayfalar: ['excel'], degerler: [['5.000', '5.000'], ['20.000', '20.000']], ayar: true },
  raporDonem: { ad: 'Ayar: varsayılan dönem', sayfalar: ['raporlar'], degerler: [['30', 'Son 30 gün'], ['7', 'Son 7 gün']], ayar: true },
  bildirimSure: { ad: 'Ayar: okunan bildirim', sayfalar: ['bildirimler'], degerler: [['30', '30 gün'], ['90', '90 gün']], ayar: true },
  listeSatir: { ad: 'Ayar: sayfa başına satır', sayfalar: ['toplu', 'kuponlar', 'siparisExcel'], degerler: [['25', '25'], ['50', '50'], ['100', '100']], ayar: true }
};
const durum = { sayfa: 'kuponlar', tema: 'acik', gorunum: 'masaustu', hal: 'liste', kuponYer: 'sepet', kuponGosterim: 'ozet', kuponIade: 'pay', kullanimIade: 'geri', kuponDegis: 'kilit', yuvarla: 'kurus', kopyaKapsam: 'hepsi', excelSatir: 'birlesim', excelBos: 'dokunma', excelHata: 'hepsi', siparisExcelYer: 'temel', raporCiro: 'odenmis', bildirimAyar: 'panelHep', ustSerit: 'var', ytBicim: 'koseli', dahilHaric: 'cevir', kargoSinir: 'sonra', kodHarf: 'duyarsiz', excelSinir: '5.000', raporDonem: '30', bildirimSure: '30', listeSatir: '25' };
const adres = new URLSearchParams(location.search);
for (const k of Object.keys(durum)) if (adres.get(k) !== null) durum[k] = adres.get(k);

const CIZICILER = {
  kuponlar: kuponlarEkrani, kuponVitrin: kuponVitrin, toplu: topluEkrani, kopya: kopyaEkrani, excel: excelEkrani, siparisExcel: siparisExcelEkrani,
  raporlar: raporlarEkrani, pano: panoEkrani, bildirimler: bildirimlerEkrani, arama: aramaEkrani, epostalar: epostalarEkrani, vergi: vergiEkrani
};

document.getElementById('sayfa-grubu').innerHTML = `<span>Ekran</span>${SAYFALAR.map(([k, a]) => `<button type="button" data-sayfa="${k}">${a}</button>`).join('')}`;
function uygula() {
  const haller = HALLER[durum.sayfa];
  if (haller.length && !haller.some(([k]) => k === durum.hal)) durum.hal = haller[0][0];
  document.getElementById('hal-grubu').innerHTML = haller.length ? `<span>Hâl</span>${haller.map(([k, a]) => `<button type="button" data-hal="${k}">${a}</button>`).join('')}` : '';
  const secimler = Object.entries(SECIMLER).filter(([k, s]) => s.sayfalar.includes(durum.sayfa) && (k !== 'urunSekme' || durum.urunDuzen === 'sekme'));
  const grup = ([k, s]) => `<div class="grup ${s.ayar ? '' : 'secim'}"><span>${s.ad}</span>${s.degerler.map(([d, a]) => `<button type="button" data-${k.replace(/[A-Z]/g, (h) => `-${h.toLowerCase()}`)}="${d}">${a}</button>`).join('')}</div>`;
  const karar = secimler.filter(([, s]) => !s.ayar);
  const ayar = secimler.filter(([, s]) => s.ayar);
  document.getElementById('secim-satiri').innerHTML = `${karar.length ? `<span class="secim-baslik">Seçilecekler:</span>${karar.map(grup).join('')}` : ''}${ayar.length ? `<span class="secim-alt-baslik">Göster:</span>${ayar.map(grup).join('')}` : ''}`;
  document.getElementById('sayfa').dataset.tema = durum.tema;
  document.getElementById('sahne').classList.toggle('telefon', durum.gorunum === 'telefon');
  document.getElementById('icerik').innerHTML = CIZICILER[durum.sayfa]();
  for (const b of document.querySelectorAll('.arac-cubugu button')) {
    const [k] = Object.keys(b.dataset);
    b.setAttribute('aria-pressed', String(String(durum[k]) === b.dataset[k]));
  }
  try { history.replaceState(null, '', `?${new URLSearchParams(durum)}`); } catch (e) { /* file:// adresinde izin verilmeyebilir */ }
}
document.querySelector('.arac-cubugu').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const [k] = Object.keys(b.dataset);
  durum[k] = b.dataset[k];
  uygula();
};
uygula();
</script>
</body>
</html>
