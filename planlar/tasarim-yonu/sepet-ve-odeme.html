<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Örnek Mağaza sepet ve ödeme taslağı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@500;600;700&display=swap">
<style>
/* Kart 0211 taslağı: Canlı Çarşı yönünde (karar 0075) sepet, ödeme ve sipariş sayfaları ile panel ekranları. Ürün kodu değildir;
   renkler burada yalnız taslağı göstermek için yazılıdır. Ortak stiller, üst ve alt kısım sayfalar.html ile aynıdır. */
* { box-sizing: border-box; }
body { margin: 0; background: #E9EBEF; font-family: 'Inter', system-ui, sans-serif; }
p { margin: 0; }
img { display: block; }

/* Seçim çubuğu (taslağın parçası, mağazanın değil) */
.arac-cubugu { position: sticky; top: 0; z-index: 20; display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; background: #16181D; color: #F2F3F5; font-size: 14px; }
.arac-satir { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.grup { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.grup > span { color: #B8BDC7; margin-right: 4px; }
.arac-cubugu button { min-height: 36px; padding: 0 12px; border: 1px solid #5A606C; background: transparent; color: #F2F3F5; border-radius: 6px; font: inherit; cursor: pointer; }
.arac-cubugu button[aria-pressed="true"] { background: #F2F3F5; color: #16181D; border-color: #F2F3F5; }
.arac-cubugu .secim button[aria-pressed="true"] { background: #F5A623; color: #16181D; border-color: #F5A623; }
.arac-cubugu a { color: #F2F3F5; }
.secim > span, .secim-baslik { color: #F5C66B; }
.secim-baslik { font-weight: 600; }
.sahne { position: relative; }
.sahne.telefon { max-width: 390px; margin: 24px auto; box-shadow: 0 0 0 1px #C9CDD5, 0 12px 32px rgba(0, 0, 0, 0.15); overflow: hidden; }
.taslak-not { display: block; margin: 0; padding: 8px 12px; border: 2px dashed #9AA1AE; border-radius: 6px; background: transparent; color: var(--soluk); font-size: 12px; line-height: 1.4; }

/* Canlı Çarşı'nın renkleri (karar 0075). Panel de aynı ortak değerleri kullanır (karar 0080). */
.sayfa[data-tema="acik"] { --zemin: #FFFFFF; --yuzey: #F5F6F8; --yazi: #1B1F27; --soluk: #5A6170; --kenar: #E3E6EB; --alan-kenari: #7A8190; --birincil: #F29F05; --birincil-yazi: #1B1F27; --indirim: #C62F21; --alt: #1E2533; --alt-yazi: #E6E9EF; --alt-soluk: #A9B1BF; --rozet: #F29F05; --rozet-yazi: #1B1F27; --bag: #1B1F27; --k1: #FDF1D6; --k2: #E2F0FF; --k3: #FFE3E3; --k4: #E4F6E8; --k5: #EFE6FF; --afis: #FFE2A8; --tehlike-yazi: #B42318; --tehlike-zemin: #FEECEB; --basari-yazi: #067647; --basari-zemin: #E6F6EC; --uyari-yazi: #8A5300; --uyari-zemin: #FEF4E2; --odak: #1D5FD1; --ortu: rgba(18, 21, 27, 0.5); }
.sayfa[data-tema="koyu"] { --zemin: #12151B; --yuzey: #1B2029; --yazi: #EEF0F4; --soluk: #A3AAB8; --kenar: #2A303B; --alan-kenari: #7C8496; --birincil: #F5A623; --birincil-yazi: #12151B; --indirim: #FF8577; --alt: #0B0D11; --alt-yazi: #E6E9EF; --alt-soluk: #A3AAB8; --rozet: #F5A623; --rozet-yazi: #12151B; --bag: #EEF0F4; --k1: #2E2716; --k2: #17263A; --k3: #3A1F22; --k4: #1A2E22; --k5: #262037; --afis: #33270F; --tehlike-yazi: #FF8577; --tehlike-zemin: #3A1F22; --basari-yazi: #6CD49A; --basari-zemin: #1A2E22; --uyari-yazi: #F5C66B; --uyari-zemin: #2E2716; --odak: #8DB4FF; --ortu: rgba(0, 0, 0, 0.6); }
.sayfa { --font-govde: 'Inter', system-ui, sans-serif; --font-baslik: 'Jost', 'Inter', sans-serif; --baslik-agirlik: 600; --r: 8px; --r-kucuk: 4px; --r-dugme: 999px; --bolum-arasi: 48px; --kart-ic: 12px; --h1: 32px; --h2: 24px; --sutun: 4; --kenar-bosluk: 24px;
  container-type: inline-size; container-name: sayfa; position: relative; background: var(--zemin); color: var(--yazi); font-family: var(--font-govde); font-size: 14px; line-height: 1.5; min-height: 100vh; }
.yalniz-tel { display: none; }
.gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--odak); outline-offset: 2px; }
.kap { max-width: 1240px; margin: 0 auto; padding: 0 var(--kenar-bosluk); }
svg.ikon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
svg.ikon.dolu { fill: currentColor; }
.ikon-dugme { width: 44px; height: 44px; border: 0; background: transparent; color: var(--yazi); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; border-radius: var(--r-kucuk); flex-shrink: 0; }
.soluk { color: var(--soluk); }
.izgara { display: grid; gap: 16px; }

@container sayfa (max-width: 640px) {
  .sayfa, .icerik { --sutun: 2; --kenar-bosluk: 16px; --bolum-arasi: 40px; --h1: 26px; --h2: 22px; }
  .icerik .yalniz-masa { display: none; }
  .icerik .yalniz-tel { display: flex; }
}

/* Üst kısım (secenekler.html ile aynı) */
.duyuru { background: var(--alt); color: var(--alt-yazi); font-size: 13px; }
.duyuru-kap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.ikonlu { display: inline-flex; align-items: center; gap: 6px; }
.ikonlu svg.ikon { width: 16px; height: 16px; }
header.ust { background: var(--zemin); border-bottom: 1px solid var(--kenar); }
.ust-satir { display: flex; align-items: center; gap: 28px; padding-top: 18px; padding-bottom: 18px; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--yazi); text-decoration: none; flex-shrink: 0; }
.logo-isaret { width: 36px; height: 36px; border-radius: var(--r-kucuk); background: var(--birincil); color: var(--birincil-yazi); display: flex; align-items: center; justify-content: center; font-family: var(--font-baslik); font-weight: 700; font-size: 18px; flex-shrink: 0; }
.logo-ad { font-family: var(--font-baslik); font-weight: var(--baslik-agirlik); font-size: 22px; }
.arama { flex-grow: 1; max-width: 560px; display: flex; align-items: center; height: 44px; border: 1px solid var(--kenar); border-radius: var(--r-dugme); background: var(--yuzey); overflow: hidden; }
.arama-girdi { flex-grow: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0 18px; color: var(--yazi); font: inherit; font-size: 14px; }
.arama-girdi::placeholder { color: var(--soluk); }
.arama-dugme { width: 44px; height: 44px; border: 0; background: var(--birincil); color: var(--birincil-yazi); display: flex; align-items: center; justify-content: center; border-radius: var(--r-dugme); cursor: pointer; flex-shrink: 0; }
.ust-eylemler { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.ust-bag { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; color: var(--yazi); text-decoration: none; font-size: 14px; }
.sepet { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-dugme); background: var(--yuzey); border: 1px solid var(--kenar); color: var(--yazi); text-decoration: none; font-size: 14px; font-weight: 600; }
.sayi { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--rozet); color: var(--rozet-yazi); font-size: 12px; display: flex; align-items: center; justify-content: center; }
.simge-sayili { position: relative; }
.simge-sayili .sayi { position: absolute; top: 2px; right: 0; }
.menu { border-top: 1px solid var(--kenar); }
.menu-kap { display: flex; align-items: center; gap: 8px; }
.kategori-dugme { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 18px; margin: 6px 12px 6px 0; border: 0; border-radius: var(--r-kucuk); background: var(--birincil); color: var(--birincil-yazi); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.menu-bag { display: flex; align-items: center; min-height: 44px; padding: 0 12px; color: var(--yazi); text-decoration: none; font-size: 14px; font-weight: 500; }
.menu-bag[aria-current="page"] { font-weight: 700; box-shadow: inset 0 -2px 0 var(--birincil); }
.tel-ust { flex-direction: column; gap: 10px; padding: 10px var(--kenar-bosluk); }
.tel-satir { display: flex; align-items: center; gap: 4px; }
.isaret-kucuk { width: 30px; height: 30px; font-size: 16px; }
.ad-kucuk { font-size: 18px; }
.arama-genis { max-width: none; }
.girdi-buyuk { font-size: 16px; }

/* Alt kısım (secenekler.html ile aynı) */
.alt { background: var(--alt); color: var(--alt-yazi); }
.alt-kap { padding-top: 44px; padding-bottom: 24px; display: flex; flex-direction: column; gap: 32px; }
.alt-sutunlar { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
.alt-sutun { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.alt-baslik { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.alt-bag { color: var(--alt-soluk); text-decoration: none; min-height: 32px; display: flex; align-items: center; }
.iletisim { display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: var(--alt-soluk); }
.alt-logo { font-size: 18px; color: var(--alt-yazi); }
.alt-satir { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-top: 20px; border-top: 1px solid var(--alt-soluk); font-size: 13px; color: var(--alt-soluk); }
.odemeler { display: flex; gap: 8px; }
.odeme { padding: 4px 10px; border: 1px solid var(--alt-soluk); border-radius: var(--r-kucuk); }
@container sayfa (max-width: 640px) { .alt-sutunlar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Ortak sayfa iskeleti: sayfa yolu, başlık, boş hâl, sayfalama (kart 0135) */
main.sayfa-ic { padding: 20px 0 var(--bolum-arasi); }
.sayfa-yolu ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--soluk); }
.sayfa-yolu a { color: var(--soluk); text-decoration: none; min-height: 32px; display: inline-flex; align-items: center; }
.sayfa-yolu li + li::before { content: "/"; margin-right: 6px; color: var(--kenar); }
.sayfa-yolu [aria-current] { color: var(--yazi); font-weight: 600; }
.sayfa-basligi { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 8px 0 20px; }
h1.b1 { margin: 0; font-family: var(--font-baslik); font-weight: var(--baslik-agirlik); font-size: var(--h1); line-height: 1.15; }
h2.b2 { margin: 0; font-family: var(--font-baslik); font-weight: var(--baslik-agirlik); font-size: var(--h2); line-height: 1.2; }
h3.b3 { margin: 0; font-size: 16px; font-weight: 700; }
.bos-hal { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 56px 16px; border-radius: var(--r); background: var(--yuzey); }
.bos-ikon { width: 64px; height: 64px; border-radius: 999px; background: var(--zemin); display: flex; align-items: center; justify-content: center; color: var(--soluk); }
.bos-ikon svg.ikon { width: 28px; height: 28px; }
.bos-hal p { max-width: 420px; }
.dugme { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 22px; border-radius: var(--r-dugme); border: 1.5px solid transparent; font: inherit; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; white-space: nowrap; }
.dugme-birincil { background: var(--birincil); color: var(--birincil-yazi); }
.dugme-koyu { background: var(--yazi); color: var(--zemin); }
.dugme-cerceve { background: transparent; color: var(--yazi); border-color: var(--yazi); }
.dugme-sade { background: transparent; color: var(--yazi); border-color: var(--kenar); }
.dugme-buyuk { min-height: 52px; font-size: 16px; }
.cipler { display: flex; flex-wrap: wrap; gap: 8px; }
.cip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 8px 0 14px; border-radius: 999px; background: var(--yuzey); border: 1px solid var(--kenar); color: var(--yazi); font: inherit; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; }
.cip svg.ikon { width: 16px; height: 16px; }
.cip-bag { padding: 0 14px; }
.sayfalama { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 32px; flex-wrap: wrap; }
.sayfa-no { min-width: 44px; height: 44px; padding: 0 6px; border-radius: var(--r-dugme); border: 1px solid var(--kenar); background: var(--zemin); color: var(--yazi); display: inline-flex; align-items: center; justify-content: center; font: inherit; font-weight: 600; text-decoration: none; }
.sayfa-no[aria-current="page"] { background: var(--yazi); color: var(--zemin); border-color: var(--yazi); }
.daha-fazla { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 32px; }
.ilerleme { width: 200px; height: 4px; border-radius: 999px; background: var(--kenar); overflow: hidden; }
.ilerleme span { display: block; height: 100%; width: 33%; background: var(--yazi); }

/* Ürün kartı (kart 0109'daki gibi) */
.izgara-urun { grid-template-columns: repeat(var(--sutun), minmax(0, 1fr)); }
.izgara-urun.uc { --sutun: 3; }
.kart { position: relative; display: flex; flex-direction: column; background: var(--zemin); border: 1px solid var(--kenar); border-radius: var(--r); overflow: hidden; min-width: 0; }
.kart-gorsel { position: relative; background: var(--yuzey); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
.kart-gorsel img { width: 86%; height: 86%; object-fit: contain; }
.kart-rozet { position: absolute; top: 10px; left: 10px; padding: 3px 8px; border-radius: var(--r-kucuk); background: var(--rozet); color: var(--rozet-yazi); font-size: 12px; font-weight: 700; }
.kart-rozet.tukendi { background: var(--yazi); color: var(--zemin); }
.kart-gorsel .ikon-dugme { position: absolute; top: 4px; right: 4px; z-index: 1; }
.kart-gorsel .ikon-dugme::before { content: ""; position: absolute; width: 32px; height: 32px; border-radius: 999px; background: var(--zemin); z-index: -1; }
.kart-gorsel .ikon-dugme.secili { color: var(--indirim); }
.kart-govde { padding: var(--kart-ic); display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
.ust-metin { font-size: 12px; color: var(--soluk); }
.kart-ad { color: var(--yazi); text-decoration: none; font-size: 14px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.yildizlar { display: flex; align-items: center; gap: 2px; color: var(--soluk); }
.yildizlar svg.ikon { width: 13px; height: 13px; }
.yildizlar.dolu-yildiz svg.ikon.dolu { color: var(--birincil); }
.fiyat { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.fiyat strong { font-size: 16px; }
.fiyat .indirimli { color: var(--indirim); }
.fiyat s { font-size: 13px; color: var(--soluk); }
.stok-yazi { font-size: 12px; font-weight: 600; color: var(--uyari-yazi); }

/* Kategori ve arama: filtre ve sıralama (kartlar 0136, 0137) */
.liste-duzen { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start; }
.liste-duzen.ust-filtre { grid-template-columns: minmax(0, 1fr); }
.filtreler { display: flex; flex-direction: column; }
.filtre-grup { border-bottom: 1px solid var(--kenar); padding: 14px 0; display: flex; flex-direction: column; gap: 10px; }
.filtre-grup:first-child { padding-top: 0; }
.filtre-baslik { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700; min-height: 32px; }
.secenek-satir { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; cursor: pointer; }
.kutucuk { width: 20px; height: 20px; border: 1.5px solid var(--alan-kenari); border-radius: var(--r-kucuk); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.kutucuk.isaretli { background: var(--yazi); border-color: var(--yazi); color: var(--zemin); }
.kutucuk svg.ikon { width: 14px; height: 14px; stroke-width: 3; }
.secenek-satir .say-adet { margin-left: auto; color: var(--soluk); font-size: 13px; }
.renk-nokta { width: 18px; height: 18px; border-radius: 999px; border: 1px solid var(--alan-kenari); flex-shrink: 0; }
/* Ürünün renk seçeneklerinin örnek renkleri (ürün verisidir, temanın değeri değildir) */
.renk-siyah { background: #1B1F27; }
.renk-beyaz { background: #FFFFFF; }
.renk-gri { background: #9AA0A8; }
.renk-lacivert { background: #22325C; }
.fiyat-araligi { display: flex; align-items: center; gap: 8px; }
.alan { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 14px; }
.alan > label, .alan-ad { font-weight: 600; font-size: 13px; }
.girdi { height: 44px; min-width: 0; width: 100%; border: 1px solid var(--alan-kenari); border-radius: var(--r-kucuk); background: var(--zemin); color: var(--yazi); padding: 0 12px; font: inherit; font-size: 14px; }
.girdi::placeholder { color: var(--soluk); }
textarea.girdi { height: 88px; padding: 10px 12px; resize: vertical; }
.ipucu { font-size: 12px; color: var(--soluk); }
.hata-yazi { font-size: 12px; color: var(--tehlike-yazi); font-weight: 600; }
.girdi.hatali { border-color: var(--tehlike-yazi); }
.liste-ust { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.siralama { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.secim-kutusu { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; height: 44px; min-width: 190px; padding: 0 12px 0 14px; border: 1px solid var(--alan-kenari); border-radius: var(--r-kucuk); background: var(--zemin); color: var(--yazi); font: inherit; font-size: 14px; cursor: pointer; }
.ust-filtre-serit { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.acilir-filtre { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 16px; border: 1px solid var(--alan-kenari); border-radius: var(--r-dugme); background: var(--zemin); color: var(--yazi); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
.acilir-filtre[aria-expanded="true"] { border-color: var(--yazi); box-shadow: inset 0 0 0 1px var(--yazi); }
.acilir-filtre .sayi { position: static; }
.acilir-panel { position: absolute; z-index: 5; margin-top: 4px; width: 280px; padding: 16px; border: 1px solid var(--kenar); border-radius: var(--r); background: var(--zemin); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); display: flex; flex-direction: column; gap: 12px; }
.panel-sar { position: relative; }
.tel-liste-cubugu { gap: 8px; margin-bottom: 12px; }
.tel-liste-cubugu .dugme { flex: 1 1 0; }
.sonuc-baslik { font-size: 15px; }
.oneri { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }

/* Yan pencere ve pencere */
.ortu { position: absolute; inset: 0; z-index: 10; background: var(--ortu); }
.yan-pencere { position: absolute; z-index: 11; top: 0; bottom: 0; right: 0; width: min(420px, 100%); background: var(--zemin); color: var(--yazi); display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0, 0, 0, 0.18); }
.yan-pencere.genis { width: min(560px, 100%); }
.yan-pencere.sol { right: auto; left: 0; }
.pencere-ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--kenar); }
.pencere-baslik { margin: 0; font-size: 18px; font-weight: 700; }
.pencere-govde { flex-grow: 1; overflow: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.pencere-alt { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--kenar); flex-wrap: wrap; }
.pencere-alt .dugme { flex: 0 0 auto; }
@container sayfa (max-width: 640px) { .pencere-alt .dugme { flex: 1 1 0; } }

/* Ürün sayfası (kart 0138) */
.urun-ust { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.galeri { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; }
.galeri-buyuk { position: relative; aspect-ratio: 1; border-radius: var(--r); background: var(--yuzey); display: flex; align-items: center; justify-content: center; overflow: hidden; }

  if (haller.length && !haller.some(([k]) => k === durum.hal)) durum.hal = haller[0][0];
  document.getElementById('hal-grubu').innerHTML = haller.length ? `<span>Hâl</span>${haller.map(([k, a]) => `<button type="button" data-hal="${k}">${a}</button>`).join('')}` : '';
  const secimler = Object.entries(SECIMLER).filter(([, s]) => s.sayfalar.includes(durum.sayfa));
  document.getElementById('secim-satiri').innerHTML = secimler.length ? `<span class="secim-baslik">Seçilecekler:</span>${secimler.map(([k, s]) => `<div class="grup secim"><span>${s.ad}</span>${s.degerler.map(([d, a]) => `<button type="button" data-${k.replace(/[A-Z]/g, (h) => `-${h.toLowerCase()}`)}="${d}">${a}</button>`).join('')}</div>`).join('')}` : '';
  document.getElementById('sayfa').dataset.tema = durum.tema;
  document.getElementById('sahne').classList.toggle('telefon', durum.gorunum === 'telefon');
  document.getElementById('icerik').innerHTML = CIZICILER[durum.sayfa]();
  for (const b of document.querySelectorAll('.arac-cubugu button')) {
    const [k] = Object.keys(b.dataset);
    b.setAttribute('aria-pressed', String(String(durum[k]) === b.dataset[k]));
  }
  try { history.replaceState(null, '', `?${new URLSearchParams(durum)}`); } catch (e) { /* file:// adresinde izin verilmeyebilir */ }
}
document.querySelector('.arac-cubugu').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const [k] = Object.keys(b.dataset);
  durum[k] = b.dataset[k];
  uygula();
};
document.getElementById('icerik').onclick = (e) => {
  const o = e.target.closest('[data-ozet-acik]');
  if (o) { durum.ozetAcik = o.dataset.ozetAcik === 'true'; uygula(); }
};
uygula();
</script>
</body>
</html>
