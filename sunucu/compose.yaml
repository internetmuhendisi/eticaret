# Yerel ortamın veritabanı (kart 0011). Gizli bilgiler kökteki .env dosyasından gelir.
# Yalnız veritabanı: pnpm veritabani-baslat. Caddy ve site kutularıyla tam ortam (kart 0016,
# karar 0028): pnpm yerel-ortam-ac; Caddy yerel-ortam.yaml dosyasındadır.
name: altyapi-yerel

services:
  veritabani:
    image: postgres:18.6-alpine
    # Docker yeniden başlayınca kendiliğinden açılır. Kuralın tek tanımı komutlar/kutu-kurali.mts;
    # buradaki değerin aynı olduğunu komutlar/testler/kutu-kurali.test.ts denetler (kart 0038).
    restart: unless-stopped
    # Bağlantı kuralları imajın varsayılanı yerine bu projenin dosyasından okunur (karar 0023).
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_PASSWORD: ${VERITABANI_YONETICI_SIFRESI:?.env dosyasında VERITABANI_YONETICI_SIFRESI yok}
    # Yalnız bu bilgisayardan erişilir.
    ports:
      - "127.0.0.1:${VERITABANI_PORTU:?.env dosyasında VERITABANI_PORTU yok}:5432"
    volumes:
      - veritabani:/var/lib/postgresql
      - ./veritabani/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Yerel posta kutusu (kart 0032, karar 0050): e-postaları yakalar, dışarı göndermez. Gönderim
  # yönlendirmesi (MP_SMTP_RELAY_*) bilerek verilmez; testi komutlar/testler/kutu-kurali.test.ts.
  # Gelenleri görmek: http://localhost:<POSTA_KUTUSU_PORTU>
  posta-kutusu:
    image: axllent/mailpit:v1.31@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTA_SMTP_PORTU:?.env dosyasında POSTA_SMTP_PORTU yok}:1025"
      - "127.0.0.1:${POSTA_KUTUSU_PORTU:?.env dosyasında POSTA_KUTUSU_PORTU yok}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  veritabani:
