# Yerel ortam (kart 0011). Şimdilik yalnız PostgreSQL; Caddy ve site kutuları kart 0016'da eklenir.
# Gizli bilgiler kökteki .env dosyasından gelir. Açmak: pnpm veritabani-baslat
name: altyapi-yerel

services:
  veritabani:
    image: postgres:18.6-alpine
    # Bağlantı kuralları imajın varsayılanı yerine bu projenin dosyasından okunur (karar 0023).
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_PASSWORD: ${VERITABANI_YONETICI_SIFRESI:?.env dosyasında VERITABANI_YONETICI_SIFRESI yok}
    # Yalnız bu bilgisayardan erişilir.
    ports:
      - "127.0.0.1:${VERITABANI_PORTU:?.env dosyasında VERITABANI_PORTU yok}:5432"
    volumes:
      - veritabani:/var/lib/postgresql
      - ./veritabani/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  veritabani:
