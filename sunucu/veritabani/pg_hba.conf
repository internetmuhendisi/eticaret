# PostgreSQL bağlantı kuralları (kart 0036, karar 0023). Yerel kutu ve sunucu aynı dosyayı kullanır.
# Kurallar yukarıdan aşağı denenir, ilk uyan kural geçerlidir. Uymayan bağlantı reddedilir.
# Bu dosya değişince kutu yeniden başlatılır (pnpm veritabani-durdur, pnpm veritabani-baslat);
# kutu dosyayı açılışta bağlar, sonradan yapılan değişikliği her zaman görmez.
#
# TÜR   VERİTABANI  KULLANICI  ADRES  YÖNTEM

# Kutunun içinden (yerel soket) şifresiz girilir. Bunun için kutuya erişim (docker exec) gerekir;
# site kutuları bu yolu göremez, ağdan bağlanır. Yönetici site kurma komutunda; sitenin kullanıcısı
# yedek provasında ve geri yüklemede: sitenin içeriğine dokunan işlem sitenin kendi kullanıcısıyla
# çalışır, yönetici olarak değil (karar 0206). Hangi veritabanına girileceğini yine izinler belirler.
local   all         all               trust

# Yönetici, kutunun dışından şifreyle her veritabanına girer.
host    all         postgres   all    scram-sha-256

# Site kullanıcısı yalnız kendi adındaki veritabanına şifreyle girer (site_<kod adı>).
host    sameuser    all        all    scram-sha-256
